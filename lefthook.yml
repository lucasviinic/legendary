pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,mjs,ts,tsx}'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{js,mjs,ts,tsx,json,css,yml,yaml}'
      run: pnpm prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
